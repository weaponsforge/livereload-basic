<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Reload Demo</title>
  <!-- CSS file -->
  <link href="main.css" rel="stylesheet" type="text/css">

  <!-- CSS file generated from style.scss -->
  <link href="style.css" rel="stylesheet" type="text/css">

  <!-- JavaScript file -->
  <script src="main.js" type="text/javascript"></script>
</head>
<body onload="init()">
  <main>
    <h1>It Works!</h1>

    <div class="imgcontainer">
      <img src="images/cute-doggo.png">
    </div>

    <div class="about-me">
      <p>
        Am smol dogge.<br>
        I do zoomies. I do sniffs. I do bork.<br>
        I protecc hooman from scary leafs. 🍃<br>
        I luv treatos. I luv belly rubs.<br>
        Sometimes I gib paw. Sometimes I gib kiss.<br>
        Always I gib maximum floof. ✨<br><br>
        Very good dogge. 11/10. Much wow. 🐾<br>
      </p>

      <div class="about-me__btn-container">
        <button
          class="btn-click"
          onclick="clickme()"
        >
          Click Me 🐶
      </button>
      </div>
    </div>
  </main>
</body>
</html>
